[workspace]
resolver = "2"
members = ["crates/easys3-core", "src-tauri"]

[workspace.package]
version = "1.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-sdk-costexplorer = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
zip = "0.6"
chrono = { version = "0.4", features = ["clock"] }
csv = "1"

[profile.release]
lto = true
codegen-units = 1
