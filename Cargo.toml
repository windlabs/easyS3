[workspace]
resolver = "2"
members = ["crates/easys3-core", "src-tauri"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
aws-sdk-s3 = "1"

[profile.release]
lto = true
codegen-units = 1
