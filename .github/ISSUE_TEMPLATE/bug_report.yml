name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。请勿填写任何 Access Key、Secret Key 或真实业务数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述实际行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: easyS3 版本
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统
      placeholder: Windows / Linux / macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先脱敏；不要粘贴凭据和私有业务数据。
