# 发布工作流：推送 v* 标签触发，三平台矩阵构建并创建 Draft Release
# 前置条件：先执行 make version VERSION=x.y.z 同步版本号，再打对应 tag
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # 允许手动触发（仅调试构建，不打 tag 时不产出 Release）

permissions:
  contents: write # 允许创建 Release 并上传资产

jobs:
  build:
    name: build (${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64：AppImage + deb
          # （选 ubuntu-22.04 而非更新版本是为了压低 glibc 门槛（2.35），
          #   该镜像 2027-04 退役，届时需重新评估构建基线）
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Linux ARM64：公开仓库免费的原生 arm64 runner
          # （glibc ≥ 2.39，覆盖 Ubuntu 24.04+ / Debian 13+ 等）
          - platform: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          # Windows x64：NSIS 安装程序
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          # macOS Apple Silicon
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: dmg
          # macOS Intel（arm64 runner 交叉编译）
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与应用版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag v$TAG 与应用版本 $APP 不一致，请先执行 make version VERSION=$TAG 并提交后再打 tag"
            exit 1
          fi

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.rust_target }}

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并上传 Release 资产
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # __VERSION__ 自动替换为 tauri.conf.json 中的应用版本
          releaseName: "easyS3 v__VERSION__"
          releaseDraft: true # 先建 Draft，人工核对后再发布
          prerelease: false
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

  # 全部平台构建完成后，汇总生成校验和文件（仅 tag 触发时执行）
  checksums:
    name: 生成校验和
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --clobber
          rm -f SHA256SUMS.txt
          sha256sum * | tee ../SHA256SUMS.txt
          cd ..
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
