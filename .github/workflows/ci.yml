# CI 验证工作流：push 到 main 或提交 PR 时运行前端构建 + Rust 格式 / Clippy / 测试
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同一分支新推送取消旧任务

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查与构建
        run: pnpm build # vue-tsc --noEmit && vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Rust 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 核心库测试
        run: cargo test -p easys3-core
